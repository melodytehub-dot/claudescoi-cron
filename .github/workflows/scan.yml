name: claudescoi scan

on:
  schedule:
    # GitHub Actions minimum: every 5 minutes. Runs may be delayed at peak times.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claudescoi-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://claudescoi.vercel.app/api/cron/scan"
